// --- SSE ---
var sseReconnectTimer = null;
var sseReconnectDelay = 1000;
// SSE 探测冷却（评审建议 2）：服务真停 + launcher 不可达时，健康检查每 10s 周期都会走到失败分支
// 调用 connectSSE() 作最终探测，会每 10s 创建一次注定失败的 EventSource。用时间戳冷却守卫收敛，
// 避免无谓的周期性失败连接。仅守卫「健康检查失败分支的探测性 connectSSE」，不影响正常建连。
var LAST_SSE_PROBE_TS = 0
var SSE_PROBE_COOLDOWN = 30000   // 第 3 轮评审：冷却窗口需大于健康检查周期（10s）才能真正限流。
// 设为 30s（约 3 个健康周期）：服务真停 + launcher 不可达时，最多每 30s 探一次注定失败的 EventSource，
// 避免每 10s 刷一次无谓网络请求与 [SSE] Connection error 日志。若 /global/health 恢复正常，
// 健康检查成功分支会立即恢复，不依赖此探测，故 30s 内恢复延迟可接受。
// SSE 探测连接标记（第 1 轮评审）：健康检查失败分支 / init 兜底分支用 connectSSE(true) 建立的
// 探测性 EventSource。探测连接失败时（服务真停）不应走标准指数退避自动重连——那会绕过
// sseProbeAllowed() 冷却守卫反复向已停止服务建连。探测失败应仅靠健康检查下一周期再触发。
var SSE_IS_PROBE = false
/**
 * 更新 SSE 连接状态 UI
 */
function updateConnectionStatus() {
    // SSE 连接状态变化时更新 UI（目前由健康检查自动处理）
    // 状态变量 CONNECTED 已同步，无需额外 UI 操作
}
/**
 * 健康检查失败分支的探测性 connectSSE 冷却守卫（评审建议 2）：
 * 服务真停 + launcher 不可达时，避免每 10s 健康检查周期都创建一次注定失败的 EventSource。
 * 通过则记录探测时间戳并返回 true；冷却期内返回 false（调用方跳过本轮探测）。
 */
function sseProbeAllowed() {
    var now = Date.now()
    if (now - LAST_SSE_PROBE_TS >= SSE_PROBE_COOLDOWN) {
        LAST_SSE_PROBE_TS = now
        return true
    }
    return false
}
/**
 * 连接 SSE 事件流接收服务端推送
 */
function connectSSE(isProbe) {
    if (SSE) { SSE.close(); SSE = null }
    // 第 1 轮评审：记录是否为探测性连接，onerror 时据此决定是否走自动重连（见下方 SSE.onerror）
    SSE_IS_PROBE = !!isProbe
    try {
        SSE = new EventSource(API_BASE + '/global/event')

        SSE.onopen = function() {
            console.log('[SSE] Connected');
            CONNECTED = true;
            SSE_IS_PROBE = false;   // 连接成功即转为真实连接，后续异常应走标准重连
            // SSE 连接成功是「服务在跑」的最强证据（EventSource 不受 XHR CORS 差异影响），
            // 同步状态条，避免 /global/health 探测失败时 UI 误显 stopped（Issue #114 回归）
            if (!STOPPING) {
                SERVER_RUNNING = true;
                updateServerStatus(true);
                // 若处于 setup 视图则同步切回 chat，与健康检查成功分支的恢复行为保持一致
                if (IN_SETUP_VIEW) {
                    showChat();
                    // 第 1 轮评审：SSE 探测恢复路径未走 onServerConnected()，补齐模型/智能体下拉框数据，
                    // 避免与 launcher 可达时走 onServerConnected() 的完整恢复行为不一致（顶部下拉框为默认占位值）。
                    // 第 5 轮评审：改用统一 helper refreshModelAgentLabels() 与 onServerConnected 共用刷新逻辑。
                    refreshModelAgentLabels();
                    // setup 探测场景（launcher 不可达 / /global/health CORS 失败）下，服务确认在跑但
                    // 未走完整 onServerConnected 流程，可能无 SESSION_ID。补建会话，避免进入 chat 无法聊天。
                    // 注意：createNewSession 仅建会话、不再回调 connectSSE() —— connectSSE() 开头会 close 当前
                    // 刚建立成功的这条 SSE 再重连，造成不必要的连接拆除/重建（评审建议 1）。当前 SSE 已在
                    // onopen 中，保留即可继续接收消息。
                    if (!SESSION_ID && !STOPPING) {
                        createNewSession();
                    }
                }
            }
            sseReconnectDelay = 1000;
            updateConnectionStatus();
            if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
        };

        SSE.onmessage = function(ev) {
            try { handleSSEEvent(JSON.parse(ev.data)) } catch(e) { logError('SSE message', e); }
        };

        SSE.onerror = function() {
            console.log('[SSE] Connection error, will reconnect...');
            CONNECTED = false;
            updateConnectionStatus();
            // #116 第 2 轮评审：连接断开时清理待响应的权限请求（避免过期模态框残留）
            if (PENDING_PERMISSION) {
                PENDING_PERMISSION = null;
                if (PERMISSION_MODAL_VISIBLE) hidePermissionDialog();
                setStatus('idle')
            }
            if (SSE) { SSE.close(); SSE = null; }
            // 自动重连（指数退避，最大30秒）
            // 第 1 轮评审：探测性连接（SSE_IS_PROBE=true）失败时不自动重连——服务可能真停，
            // 应交给健康检查下一周期按 sseProbeAllowed() 冷却节奏重新探测，避免绕过冷却反复向已停止服务建连。
            if (SSE_IS_PROBE) { SSE_IS_PROBE = false; return }
            if (!sseReconnectTimer) {
                sseReconnectTimer = setTimeout(function() {
                    sseReconnectTimer = null;
                    if (SESSION_ID) {
                        console.log('[SSE] Reconnecting...');
                        connectSSE();
                    }
                }, sseReconnectDelay);
                sseReconnectDelay = Math.min(sseReconnectDelay * 2, 30000);
            }
        };
    } catch(e) { logError('SSE init', e); }
}
function handleSSEEvent(data) {
    if (!data || !data.payload) return
    var type = data.payload.type, props = data.payload.properties || {}
    if (props.sessionID && props.sessionID !== SESSION_ID) return
    switch(type) {
        case 'session.status':
            if (props.status) {
                // #116 问题十三：支持 waiting（等待权限确认）中间态
                var st = props.status.type
                if (st === 'busy') setStatus('busy')
                else if (st === 'idle') { if (PENDING_PERMISSION) { setStatus('waiting') } else { setStatus('idle'); finalizeStreaming() } }
                else setStatus(st === 'waiting' || st === 'waiting-for-input' ? 'waiting' : (st === 'idle' ? 'idle' : 'busy'))
                // #116 问题三 + session_ffa9 假修复：多路径防御性提取上下文用量
                // session_ff63 问题二：SSE 事件取不到数据时诚实降级提示（但若已展示过真实数据则不覆盖）
                var usage = extractCtxUsage(props.status)
                if (usage && typeof usage.percent === 'number') updateCtxMeter(usage.percent, usage)
                else if (!CTX_DATA_SEEN) ctxMeterNoData()
            }
            break
        case 'session.permission':
        case 'session.permission.request':
        case 'session.tool.request':
        case 'control.request':
            // #116 问题二：权限请求下发 → 弹出确认框
            handlePermissionRequest(type, props)
            break
        case 'message.updated':
            if (props.info && props.info.role === 'assistant' && !props.info.finish) {
                STREAMING_MSG_ID = props.info.id; STREAMING_TEXT = ''; STREAMING_REASONING = ''; STREAMING_TEXT_PART_ID = ''; STREAMING_REASONING_PART_ID = ''
                ensureStreamingBubble()
                if (props.info.modelID && !CURRENT_MODEL) { CURRENT_MODEL = props.info.modelID; $modelName.textContent = CURRENT_MODEL }
            }
            if (props.info && props.info.role === 'assistant' && props.info.finish) finalizeStreaming()
            // #116 问题三 + session_ffa9 假修复：消息更新时多路径提取上下文用量
            // session_ff63 问题二：取不到数据时诚实降级提示（但若已展示过真实数据则不覆盖）
            var msgUsage = extractCtxUsage(props)
            if (msgUsage && typeof msgUsage.percent === 'number') updateCtxMeter(msgUsage.percent, msgUsage)
            else if (!CTX_DATA_SEEN) ctxMeterNoData()
            break
        case 'message.part.updated':
            if (props.part) {
                PART_TYPES[props.part.id] = { type: props.part.type, messageID: props.part.messageID }
                if (props.part.type === 'text' && props.part.messageID === STREAMING_MSG_ID) { STREAMING_TEXT_PART_ID = props.part.id; if (props.part.text && props.part.time && props.part.time.end) { STREAMING_TEXT = props.part.text; updateStreamingBubble() } }
                if (props.part.type === 'reasoning' && props.part.messageID === STREAMING_MSG_ID) { STREAMING_REASONING_PART_ID = props.part.id; if (props.part.text && props.part.time && props.part.time.end) { STREAMING_REASONING = props.part.text; updateStreamingBubble() } }
            }
            break
        case 'message.part.delta':
            if (props.field === 'text' && props.delta) {
                var pi = PART_TYPES[props.partID]
                if (pi) { if (pi.type === 'text') STREAMING_TEXT += props.delta; else if (pi.type === 'reasoning') STREAMING_REASONING += props.delta }
                else if (props.partID === STREAMING_TEXT_PART_ID) STREAMING_TEXT += props.delta
                else if (props.partID === STREAMING_REASONING_PART_ID) STREAMING_REASONING += props.delta
                else STREAMING_TEXT += props.delta
                updateStreamingBubble()
            }
            break
        case 'session.summary':
        case 'message.summary':
        case 'session.compacted':
        case 'session.compaction':
            // session_ffa9 补充：会话压缩事件显式提示（原「压缩无感知」体验缺口）。
            // 压缩后上下文被摘要替代，此前已累加的关键校对数据若未落盘将不可恢复，
            // 故这里提示用户：若在校对流程中，请确认数据已通过 proofreadAccumulate 落盘。
            addSystemMessage('⚠️ 会话上下文已压缩（Compaction），长上下文被摘要替代。' +
                '若正在校对，请确认各批问题已通过 proofreadAccumulate 累加（数据已落盘）；' +
                '必要时可手动开新会话保留完整上下文。')
            // 压缩后用量应归零重新累计，重置显示
            $ctxMeterFill.style.width = '0%'
            $ctxMeterInfo.textContent = '上下文已压缩'
            $ctxMeterInfo.style.display = ''
            break
    }
}

// --- #116 权限确认 & 上下文用量 ---
/**
 * 处理权限请求事件（session.permission / control.request 等）
 * 兼容多种事件格式：properties 可能含 permissionID、tool、request 等字段
 */
function handlePermissionRequest(type, props) {
    // #116 第 2 轮评审：若已有未响应的权限请求，先隐藏旧的（防静默覆盖导致第一个请求永不响应）
    if (PENDING_PERMISSION) {
        console.warn('[Permission] 已有待响应的权限请求，新权限请求到来，先清理旧请求');
        if (PERMISSION_MODAL_VISIBLE) hidePermissionDialog();
        PENDING_PERMISSION = null;
    }
    // 从不同字段结构提取权限请求信息
    // 优先取内嵌 permission.id（最可靠），其次取显式 ID 字段，最后才用 props.id 兑底
    var permissionID = (props.permission ? props.permission.id : '') || props.permissionID || props.permission_id || props.requestID || props.id || ''
    var toolInfo = props.tool || props.request || props.permission || null
    var toolName = ''
    var toolArgs = ''
    var toolDesc = ''

    if (toolInfo) {
        toolName = toolInfo.tool || toolInfo.name || toolInfo.command || toolInfo.title || '未知工具'
        toolArgs = toolInfo.input ? JSON.stringify(toolInfo.input, null, 2) : (toolInfo.arguments ? JSON.stringify(toolInfo.arguments, null, 2) : (toolInfo.body ? JSON.stringify(toolInfo.body, null, 2) : ''))
        toolDesc = toolInfo.description || toolInfo.title || ''
    } else if (props.title || props.description) {
        toolName = props.title || '工具调用'
        toolDesc = props.description || ''
        toolArgs = props.message || ''
    }

    PENDING_PERMISSION = { id: permissionID, toolName: toolName, toolArgs: toolArgs }
    // Issue #116 权限自动确认：配置为 auto 时直接自动允许，不再弹窗，避免长任务（如 97 批校对）
    // 因权限确认而卡住（此前只能切到 serve web 会话确认，侧边栏静默等待）。
    // manual 模式才弹窗人工确认。
    var permCfg = CONFIG && CONFIG.permission ? CONFIG.permission : null
    if (permCfg && permCfg.mode === 'auto') {
        console.log('[Permission] auto-allow (config mode=auto):', toolName)
        setStatus('busy')
        respondPermission('allow')
        return
    }
    setStatus('waiting')
    showPermissionDialog(toolName, toolArgs, toolDesc)
}

/** 弹出权限确认对话框 */
function showPermissionDialog(toolName, toolArgs, toolDesc) {
    if (!toolName) toolName = '未知名工具'
    $permToolName.textContent = toolName
    $permToolArgs.textContent = toolArgs || '（无参数）'
    $permToolDesc.textContent = toolDesc ? (toolDesc.length > 120 ? toolDesc.substring(0, 120) + '…' : toolDesc) : ''
    $permRemember.checked = false
    $permModal.style.display = 'flex'
    PERMISSION_MODAL_VISIBLE = true
}

/** 响应权限请求（允许 / 拒绝） */
function respondPermission(response) {
    if (!PENDING_PERMISSION) { hidePermissionDialog(); return }
    var permId = PENDING_PERMISSION.id
    var remember = $permRemember.checked
    hidePermissionDialog()
    setStatus('busy')

    // 发送响应到 OpenCode 服务（经 CORS 代理转发）
    var payload = { response: response }
    if (remember) payload.remember = true

    if (!permId) {
        // 无权限 ID（可能是 control 模式）：直接走 control/response 端点
        sendControlPermissionResponse(response, remember)
        return
    }

    fetchJSON('POST', '/session/' + SESSION_ID + '/permissions/' + encodeURIComponent(permId), payload, function(r) {
        PENDING_PERMISSION = null
        console.log('[Permission] responded:', response)
    }, function(s, t) {
        // 失败时回退：尝试 control/response 端点
        PENDING_PERMISSION = null
        console.error('[Permission] respond failed:', t)
        addSystemMessage('⚠️ 权限响应失败，正在尝试通过 control 端点重试…')
        sendControlPermissionResponse(response, remember)
    })
}

/** 通过 /tui/control/response 端点响应权限（session 权限端点不可用时的回退） */
function sendControlPermissionResponse(response, remember) {
    var controlPayload = { body: { type: 'permission', response: response, remember: remember } }
    fetchJSON('POST', '/tui/control/response', controlPayload, function(r2) {
        // #116 第 3 轮评审：响应成功后清除 PENDING_PERMISSION，避免 stale "waiting" 状态
        PENDING_PERMISSION = null
    }, function(s2, t2) {
        addSystemMessage('权限响应失败: ' + (t2 || ('status ' + s2)))
    })
}


// ===== /tui/control/next 长轮询兜底（Issue #116 权限确认） =====
// 背景：OpenCode headless serve 的权限/控制请求可能经 GET /tui/control/next 长轮询下发
// （serve web 页面走此通道），而侧边栏此前只监听 SSE 事件，收不到 → 权限请求静默等待、任务卡住。
// 这里实现 control/next 长轮询作为兜底通道：收到控制请求时，若配置为 auto 则自动允许，
// manual 则弹窗。与 SSE 事件通道互为双保险。

/** 启动 /tui/control/next 长轮询（幂等，同一时刻只有一个轮询在跑） */
function startControlNextPoll() {
    if (CONTROL_POLLING) return
    CONTROL_POLLING = true
    controlNextPollOnce()
}

/** 停止 /tui/control/next 长轮询（会话切换/服务停止时调用） */
function stopControlNextPoll() {
    CONTROL_POLLING = false
    if (CONTROL_POLL_XHR) {
        try { CONTROL_POLL_XHR.abort() } catch (e) { /* 忽略 abort 异常 */ }
        CONTROL_POLL_XHR = null
    }
    if (CONTROL_POLL_RETRY) {
        clearTimeout(CONTROL_POLL_RETRY)
        CONTROL_POLL_RETRY = null
    }
}

/** 单次长轮询：GET /tui/control/next，返回后递归下一次 */
function controlNextPollOnce() {
    if (!CONTROL_POLLING || STOPPING || !SERVER_RUNNING) return
    // 用原生 XHR 做长连接（timeout=0 不超时，保持挂起直到服务端下发控制请求）
    var xhr = new XMLHttpRequest()
    CONTROL_POLL_XHR = xhr
    xhr.timeout = 0
    xhr.open('GET', API_BASE + '/tui/control/next', true)
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return
        CONTROL_POLL_XHR = null
        if (xhr.status === 200) {
            var req = null
            try { req = JSON.parse(xhr.responseText) } catch (e) { req = null }
            if (req) handleControlRequest(req)
        } else if (xhr.status === 204) {
            // 204 无内容：服务端无待处理控制请求，正常，继续下一轮
        } else if (xhr.status === 0) {
            // 请求被中断（stopControlNextPoll abort / 网络断开），不重连
        } else {
            // 其他错误状态：短暂延迟后重连（避免热循环）
            scheduleControlNextPoll(2000)
            return
        }
        // 正常完成本轮，继续下一轮
        scheduleControlNextPoll(0)
    }
    xhr.onerror = function() {
        CONTROL_POLL_XHR = null
        // 网络错误：若仍应轮询，延迟重连
        if (CONTROL_POLLING && SERVER_RUNNING && !STOPPING) scheduleControlNextPoll(3000)
    }
    xhr.ontimeout = function() {
        CONTROL_POLL_XHR = null
        if (CONTROL_POLLING && SERVER_RUNNING && !STOPPING) scheduleControlNextPoll(0)
    }
    xhr.send()
}

/** 安排下一轮长轮询（延迟 delayMs 毫秒） */
function scheduleControlNextPoll(delayMs) {
    if (!CONTROL_POLLING || STOPPING || !SERVER_RUNNING) return
    if (CONTROL_POLL_RETRY) clearTimeout(CONTROL_POLL_RETRY)
    CONTROL_POLL_RETRY = setTimeout(function() {
        CONTROL_POLL_RETRY = null
        controlNextPollOnce()
    }, delayMs)
}

/** 处理 control/next 返回的控制请求（含权限请求） */
function handleControlRequest(req) {
    var type = req && (req.type || (req.body && req.body.type)) || ''
    var data = req && (req.data || req.body || req) || null
    // 识别权限请求：type 为 permission，或请求体含权限相关字段（覆盖多种字段命名）
    // W2 加固：除 tool/permission/permissionID 外，兼容 permission_id/requestID/toolName 等命名，
    // 避免 OpenCode 不同版本字段命名差异导致权限请求被漏过、任务静默卡住。
    var isPermission =
        type === 'permission' ||
        (data && data.response === undefined &&
            (data.tool || data.permission || data.permissionID || data.permission_id || data.requestID || data.toolName))
    if (isPermission) {
        // 权限类控制请求 → 按配置 auto 自动允许 / manual 弹窗
        handlePermissionRequest(type || 'control.request', data || req)
    } else {
        // 非权限控制请求（如系统提示），当前侧边栏无需处理，静默忽略避免阻塞后续
    }
}

/** 关闭权限确认对话框 */
function hidePermissionDialog() {
    $permModal.style.display = 'none'
    PERMISSION_MODAL_VISIBLE = false
}

/** #116 第 4 轮评审：切换会话 / 新建会话时清理待响应的权限请求 */
function clearPendingPermission() {
    if (PENDING_PERMISSION || PERMISSION_MODAL_VISIBLE) {
        PENDING_PERMISSION = null
        if (PERMISSION_MODAL_VISIBLE) hidePermissionDialog()
    }
}

/**
 * 更新上下文用量条
 * @param {number} percent 用量百分比（0-100）
 * @param {object} usage 详细用量数据（可选）
 */
function updateCtxMeter(percent, usage) {
    if (typeof percent !== 'number' || isNaN(percent)) return
    percent = Math.max(0, Math.min(100, percent))
    CTX_PERCENT = percent
    CTX_DATA_SEEN = true // 已获取到真实用量数据（session_ff63 问题二：后续无数据事件不再降级覆盖）
    $ctxMeterFill.style.width = percent + '%'
    $ctxMeter.className = 'ctx-meter' + (percent >= 90 ? ' danger' : (percent >= 70 ? ' warn' : ''))
    if (usage) {
        var used = usage.used || usage.tokens || usage.usedTokens || ''
        var max = usage.total || usage.limit || usage.totalTokens || ''
        var label = Math.round(percent) + '%'
        if (used && max) label += ' · ' + formatTokens(used) + '/' + formatTokens(max)
        $ctxMeterInfo.textContent = label
    } else {
        $ctxMeterInfo.textContent = Math.round(percent) + '%'
    }
    // 信息默认可见（session_ffa9 假修复：不再需要点击 3px 细条才显示）
    $ctxMeterInfo.style.display = ''
}

/**
 * 从会话/消息数据中防御性提取上下文用量（session_ffa9 假修复根因）。
 * OpenCode 服务在 headless serve 模式下实际下发的用量字段名未经真实抓包确认，
 * 故多路径探测以下字段组合，任一命中即返回 { percent, used, total }：
 *   - usage.percent / usage.used+total / usage.usedTokens+totalTokens
 *   - tokens.percent / tokens.used+total
 *   - context.percent / context.tokens.used+total / context.tokens.percent
 *   - info.usage / info.tokens / status.usage / status.tokens（由调用方传入对应对象）
 * 返回 null 表示未探测到可用用量数据（调用方应降级展示）。
 */
function extractCtxUsage(obj) {
    if (!obj || typeof obj !== 'object') return null
    function readTokens(node) {
        if (!node || typeof node !== 'object') return null
        var pct = node.percent
        var used = node.used || node.usedTokens || node.tokensUsed
        var total = node.total || node.limit || node.totalTokens || node.tokensTotal
        if (typeof pct === 'number' && !isNaN(pct)) {
            if (typeof total === 'number' && total > 0 && typeof used !== 'number') {
                used = total * pct / 100
            }
            return { percent: pct, used: used, total: total }
        }
        if (typeof used === 'number' && typeof total === 'number' && total > 0) {
            return { percent: (used / total) * 100, used: used, total: total }
        }
        return null
    }
    // 直接命中 usage/tokens/context 节点
    var direct = readTokens(obj.usage) || readTokens(obj.tokens) || readTokens(obj.context && obj.context.tokens)
    if (direct) return direct
    // 嵌套在 info / status 下
    var nested = readTokens(obj.info && (obj.info.usage || obj.info.tokens)) ||
                 readTokens(obj.status && (obj.status.usage || obj.status.tokens))
    if (nested) return nested
    // context 顶层含 percent/used/total
    if (obj.context && typeof obj.context === 'object') {
        var ctx = readTokens(obj.context)
        if (ctx) return ctx
    }
    return null
}

/**
 * 上下文用量条降级展示：无可用用量数据时明确提示（session_ffa9 假修复的诚实降级）。
 * 既不显示假的百分比，也不隐瞒「数据未到」——提示用户 OpenCode 未提供用量数据。
 */
function ctxMeterNoData() {
    $ctxMeterFill.style.width = '0%'
    $ctxMeter.className = 'ctx-meter nodata'
    $ctxMeterInfo.textContent = '上下文用量: 等待数据…（OpenCode 未提供则不会显示百分比）'
    $ctxMeterInfo.style.display = ''
}

/** 切换上下文用量提示显隐 */
function toggleCtxTooltip(e) {
    CTX_TOOLTIP_VISIBLE = !CTX_TOOLTIP_VISIBLE
    $ctxMeterInfo.style.display = CTX_TOOLTIP_VISIBLE ? '' : 'none'
    if (e) e.stopPropagation()
}

/** 格式化 token 数（如 42300 → 42.3K） */
function formatTokens(n) {
    if (typeof n !== 'number' || isNaN(n)) return String(n || '')
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M'
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K'
    return String(Math.round(n))
}

// --- Streaming UI ---
function ensureStreamingBubble() { var el = document.getElementById('streaming-msg'); if (!el) { el = document.createElement('div'); el.id = 'streaming-msg'; el.className = 'msg-assistant'; el.innerHTML = '<span class="streaming-cursor"></span>'; $messages.appendChild(el); scrollToBottom() } }
function updateStreamingBubble() {
    var el = document.getElementById('streaming-msg'); if (!el) { ensureStreamingBubble(); el = document.getElementById('streaming-msg') }
    var html = ''
    if (STREAMING_REASONING) { html += '<div class="thinking-toggle" onclick="toggleThinking(this)">&#9654; 思考中 (' + STREAMING_REASONING.length + ' chars)</div><div class="thinking-content">' + escapeHtml(STREAMING_REASONING) + '</div>' }
    if (STREAMING_TEXT) { try { html += renderMarkdown(STREAMING_TEXT) } catch(e) { html += escapeHtml(STREAMING_TEXT) } html += '<span class="streaming-cursor"></span>' } else if (!STREAMING_REASONING) { html += '<span class="streaming-cursor"></span>' }
    el.innerHTML = html; scrollToBottom()
}
// 格式化发送消息的错误提示：识别 UnknownError 等服务端错误，给出可操作的排查引导
function formatSendError(status, respText) {
    var raw = respText || ('status ' + status);
    var msg = 'Error: ' + raw;
    try {
        var obj = JSON.parse(respText || '');
        if (obj && obj.name === 'UnknownError') {
            var ref = obj.data && obj.data.ref ? obj.data.ref : '';
            msg = 'Error: 服务端处理失败（' + (obj.data && obj.data.message ? obj.data.message : 'Unexpected server error') + '）' +
                  (ref ? '，引用号 ' + ref + '。' : '。') +
                  '\n\u256c OpenCode 服务端内部错误，非插件问题。请查看服务端日志定位根因（按实际用户目录查找）：\n' +
                  '    <用户目录>\\.opencode\\logs\\opencode-serve.log（如 C:\\Users\\<你的用户名>，搜索 ' + (ref || '报错时间点') + '）\n' +
                  '常见原因：模型 API key 失效/限流、模型不存在、provider 配置错误，或文档上下文过大。详见 docs/TROUBLESHOOTING.md「UnknownError 排查」。';
        }
    } catch (e) { /* 非 JSON 错误，保留原始信息 */ }
    return msg;
}
function finalizeStreaming() {
    var el = document.getElementById('streaming-msg')
    if (el && (STREAMING_TEXT || STREAMING_REASONING)) {
        var html = ''
        if (STREAMING_REASONING) html += '<div class="thinking-toggle" onclick="toggleThinking(this)">&#9654; 思考中 (' + STREAMING_REASONING.length + ' chars)</div><div class="thinking-content">' + escapeHtml(STREAMING_REASONING) + '</div>'
        if (STREAMING_TEXT) { try { html += renderMarkdown(STREAMING_TEXT) } catch(e) { html += escapeHtml(STREAMING_TEXT) } }
        el.innerHTML = html; el.removeAttribute('id')
    } else if (el) el.removeAttribute('id')
    STREAMING_MSG_ID = ''; STREAMING_TEXT = ''; STREAMING_REASONING = ''; STREAMING_TEXT_PART_ID = ''; STREAMING_REASONING_PART_ID = ''
    // #116 问题十三：若仍待权限确认，保持 waiting 状态而非 idle
    setStatus(PENDING_PERMISSION ? 'waiting' : 'idle'); scrollToBottom()
}
function toggleThinking(el) { var c = el.nextElementSibling; if (c) { c.classList.toggle('show'); el.innerHTML = (c.classList.contains('show') ? '&#9660;' : '&#9654;') + ' 思考中 (' + c.textContent.length + ' 字符)' } }

// --- Messages ---
function addUserMessage(text) { var el = document.createElement('div'); el.className = 'msg-user'; el.textContent = text; $messages.appendChild(el); scrollToBottom() }
function addAssistantMessage(text, reasoning) {
    var el = document.createElement('div'); el.className = 'msg-assistant'; var html = ''
    if (reasoning) html += '<div class="thinking-toggle" onclick="toggleThinking(this)">&#9654; 思考中 (' + reasoning.length + ' chars)</div><div class="thinking-content">' + escapeHtml(reasoning) + '</div>'
    try { html += renderMarkdown(text || '') } catch(e) { html += escapeHtml(text || '') }; el.innerHTML = html; $messages.appendChild(el); scrollToBottom()
}
function addSystemMessage(text) { var el = document.createElement('div'); el.className = 'msg-system'; el.textContent = text; $messages.appendChild(el); scrollToBottom() }

// --- Send ---
/**
 * 发送聊天消息
 */
function sendMessage() {
    var text = $input.value.trim(); if (!text || IS_BUSY || !SESSION_ID) return
    addUserMessage(text)
    if (INPUT_HISTORY.indexOf(text) === -1) INPUT_HISTORY.push(text)
    INPUT_HISTORY_INDEX = -1
    $input.value = ''; autoGrow($input); setStatus('busy')
    injectContext(function() {
        var body = { parts: [{ type: 'text', text: text }] }
        if (CURRENT_MODE && CURRENT_MODE !== 'build') body.mode = CURRENT_MODE
        if (CURRENT_LEVEL && CURRENT_LEVEL !== 'balanced') body.level = CURRENT_LEVEL
        if (CURRENT_AGENT) body.agent = CURRENT_AGENT
        if (CURRENT_MODEL && CURRENT_MODEL.includes('/')) {
            var parts = CURRENT_MODEL.split('/')
            body.model = { providerID: parts[0], modelID: parts.slice(1).join('/') }
        }
        postMessage('/session/' + SESSION_ID + '/message', body, function(s, t) { addSystemMessage(formatSendError(s, t)); finalizeStreaming() })
    })
}
function injectContext(cb) {
    var ctx = gatherWpsContext(); if (!ctx || ctx === LAST_INJECTED_CONTEXT) { cb(); return }
    LAST_INJECTED_CONTEXT = ctx
    var xhr = new XMLHttpRequest(); xhr.timeout = NETWORK_TIMEOUT
    xhr.onreadystatechange = function() { if (xhr.readyState === 4) cb() }
    xhr.onerror = function() { cb() }; xhr.ontimeout = function() { cb() }
    xhr.open('POST', API_BASE + '/session/' + SESSION_ID + '/message', true)
    xhr.setRequestHeader('Content-Type', 'application/json')
    xhr.send(JSON.stringify({ noReply: true, parts: [{ type: 'text', text: ctx }] }))
}
function handleFileUpload(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (!SESSION_ID) { addSystemMessage('Please start a session first'); return }
    if (file.size > 100 * 1024 * 1024) { addSystemMessage('文件过大（最大 100MB）'); return }
    addSystemMessage('上传中: ' + file.name);
    var reader = new FileReader();
    reader.onload = function(evt) {
        var base64 = evt.target.result.split(',')[1];
        // 文件内容以 base64 发送到服务端，可能在服务端日志/消息历史中留存
        // 含敏感信息的文件建议使用完毕后清理服务器端会话历史
        // filename/type 清洗换行/控制字符：避免伪造 </file-upload> 结束标记注入额外块
        var safeName = String(file.name).replace(/[\r\n\x00-\x1f]/g, ' ');
        var safeType = String(file.type || '').replace(/[\r\n\x00-\x1f]/g, ' ');
        var msg = '<file-upload>\nfilename: ' + safeName + '\ntype: ' + safeType + '\ndata: ' + base64 + '\n</file-upload>';
        postMessage('/session/' + SESSION_ID + '/message', { parts: [{ type: 'text', text: msg }] });
    };
    reader.readAsDataURL(file);
    e.target.value = ''
}
function forceInjectContext() {
    if (!SESSION_ID || IS_BUSY) return; LAST_INJECTED_CONTEXT = ''
    var ctx = gatherWpsContext(); if (!ctx) { addSystemMessage('No document context available'); return }
    LAST_INJECTED_CONTEXT = ctx; addSystemMessage('Document context injected')
    postMessage('/session/' + SESSION_ID + '/message', { noReply: true, parts: [{ type: 'text', text: ctx }] }, null, NETWORK_TIMEOUT)
}
function gatherWpsContext() {
    var lines = []
    try { var doc = window.Application.ActiveDocument; if (doc) { if (doc.Name) lines.push('Current document: ' + doc.Name); if (doc.Path) lines.push('Path: ' + doc.Path) } } catch(e) {}
    try { var sel = window.Application.Selection; if (sel && sel.Text && sel.Text.trim()) { var t = sel.Text; if (t.length > 3000) t = t.substring(0, 3000) + '...[truncated]'; lines.push(''); lines.push('选中文本:'); lines.push('"""'); lines.push(t); lines.push('"""') } } catch(e) {}
    if (lines.length === 0) return null
    return '<wps-context>\n' + lines.join('\n') + '\n</wps-context>'
}
function abortMessage() { if (!SESSION_ID) return; fetchJSON('POST', '/session/' + SESSION_ID + '/abort', null, function() { addSystemMessage('Aborted'); finalizeStreaming() }) }

// --- Input ---
var MAX_INPUT_HEIGHT = 200;
function onInputKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
    else if (e.key === 'ArrowUp') {
        e.preventDefault()
        if (INPUT_HISTORY.length > 0) {
            if (INPUT_HISTORY_INDEX < INPUT_HISTORY.length - 1) INPUT_HISTORY_INDEX++
            if (INPUT_HISTORY_INDEX >= 0) {
                $input.value = INPUT_HISTORY[INPUT_HISTORY.length - 1 - INPUT_HISTORY_INDEX]
                autoGrow($input)
            }
        }
    }
    else if (e.key === 'ArrowDown') {
        e.preventDefault()
        if (INPUT_HISTORY_INDEX > 0) {
            INPUT_HISTORY_INDEX--
            $input.value = INPUT_HISTORY[INPUT_HISTORY.length - 1 - INPUT_HISTORY_INDEX]
            autoGrow($input)
        }
        else if (INPUT_HISTORY_INDEX === 0) {
            INPUT_HISTORY_INDEX = -1
            $input.value = ''
            autoGrow($input)
        }
    }
    updateSendButton()
}
/**
 * 自动调整文本框高度
 * @param {HTMLElement} el - 文本框元素
 */
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, MAX_INPUT_HEIGHT) + 'px'; updateSendButton() }
function updateSendButton() { $sendBtn.className = 'send-btn ' + ($input.value.trim().length > 0 && !IS_BUSY ? 'ready' : 'disabled') }
function updateInputState() {
    $input.disabled = IS_BUSY
    if (IS_BUSY) { $sendArea.innerHTML = '<button class="stop-btn" onclick="abortMessage()" title="停止"><div class="stop-icon"></div></button>' }
    else { $sendArea.innerHTML = '<button class="send-btn disabled" id="send-btn" onclick="sendMessage()" title="Send"><span class="icon-send"></span></button>'; $sendBtn = document.getElementById('send-btn'); updateSendButton() }
}

// --- Markdown ---
/**
 * 将 Markdown 文本渲染为 HTML
 * 流程：提取代码块 → 提取行内代码 → 全局 escapeHtml → 恢复占位符 → 逐行解析
 * @param {string} text - 原始 Markdown 文本
 * @returns {string} 渲染后的 HTML
 */
function renderMarkdown(text) {
    if (!text) return ''
    var codeBlocks = []
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
        codeBlocks.push('<pre><code>' + escapeHtml(code) + '</code></pre>')
        return '\x00CB' + (codeBlocks.length - 1) + '\x00'
    })
    var inlineCodes = []
    text = text.replace(/`([^`\n]+)`/g, function(m, code) {
        inlineCodes.push('<code>' + escapeHtml(code) + '</code>')
        return '\x00IC' + (inlineCodes.length - 1) + '\x00'
    })
    text = escapeHtml(text)
    text = text.replace(/\x00CB(\d+)\x00/g, function(m, i) { return codeBlocks[i] })
    text = text.replace(/\x00IC(\d+)\x00/g, function(m, i) { return inlineCodes[i] })
    var lines = text.split('\n')
    var out = '', inList = false, listType = '', inPara = false, inTable = false
    function closeList() { if (inList) { out += '</' + listType + '>'; inList = false; listType = '' } }
    function closePara() { if (inPara) { out += '</p>'; inPara = false } }
    function closeTable() { if (inTable) { out += '</tbody></table>'; inTable = false } }
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i]
        if (line.indexOf('<pre>') === 0 || line.indexOf('</pre>') !== -1) { closeList(); closePara(); closeTable(); out += line; continue }
        if (/^\s*$/.test(line)) { closeList(); closePara(); closeTable(); continue }
        var hm = line.match(/^(#{1,4})\s+(.+)$/)
        if (hm) { closeList(); closePara(); closeTable(); var lv = hm[1].length; out += '<h' + lv + '>' + inlineFmt(hm[2]) + '</h' + lv + '>'; continue }
        if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); closePara(); closeTable(); out += '<hr>'; continue }
        if (/^&gt;\s?/.test(line)) { closeList(); closePara(); closeTable(); out += '<blockquote>' + inlineFmt(line.replace(/^&gt;\s?/, '')) + '</blockquote>'; continue }
        var ulm = line.match(/^[-*]\s+(.+)$/)
        if (ulm) { closePara(); closeTable(); if (!inList || listType !== 'ul') { closeList(); out += '<ul>'; inList = true; listType = 'ul' } out += '<li>' + inlineFmt(ulm[1]) + '</li>'; continue }
        var olm = line.match(/^\d+\.\s+(.+)$/)
        if (olm) { closePara(); closeTable(); if (!inList || listType !== 'ol') { closeList(); out += '<ol>'; inList = true; listType = 'ol' } out += '<li>' + inlineFmt(olm[1]) + '</li>'; continue }
        if (/^\|(.+)\|$/.test(line) && line.split('|').length > 3) {
            closeList(); closePara()
            if (/^\|[\s\-:|]+\|$/.test(line)) continue
            if (!inTable) { out += '<table style="border-collapse:collapse;margin:8px 0"><tbody>'; inTable = true }
            var cells = line.replace(/^\||\|$/g, '').split('|')
            out += '<tr>' + cells.map(function(c) { return '<td style="border:1px solid #ddd;padding:4px 8px">' + inlineFmt(c.trim()) + '</td>' }).join('') + '</tr>'
            continue
        }
        closeList(); closeTable()
        if (inPara) { out += ' ' + inlineFmt(line) } else { out += '<p>' + inlineFmt(line); inPara = true }
    }
    closeList(); closePara(); closeTable()
    return out
}
/**
 * 解码 HTML 实体为原始字符（与 escapeHtml 的 5 个基本实体 + 数字实体对应）
 * @param {string} s - 待解码字符串
 * @returns {string} 解码后的字符串
 */
function decodeHtmlEntities(s) {
    if (!s) return ''
    // 注意：&amp; 必须最先解码，避免二次解码
    return s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&#x([0-9a-fA-F]+);/g, function(m, h) { return String.fromCharCode(parseInt(h, 16)) }).replace(/&#(\d+);/g, function(m, d) { return String.fromCharCode(parseInt(d, 10)) })
}
/**
 * 安全处理 URL 链接，防止 XSS
 * 注：入参 url 在 renderMarkdown 中已被全局 escapeHtml 转义（如 & 已为 &amp;），
 *     此处先完整解码还原真实 URL 再校验，避免二次转义破坏带 & 参数的合法链接；
 *     同时 `jav&#x61;script:` 之类的编码混淆绕过也能有效拦截。
 * @param {string} url - 待处理的 URL（可为已转义文本）
 * @returns {string} 安全的 URL 或 "#"
 */
function safeHref(url) {
    if (!url) return '#'
    var decoded = decodeHtmlEntities(url)
    var trimmed = decoded.replace(/^\s+|\s+$/g, '')
    // 协议检测前去除控制字符/空白（OWASP 建议），防 `jav\nascript:` 之类混淆绕过
    var low = trimmed.replace(/[\x00-\x20\x7f]/g, '').toLowerCase()
    if (low.indexOf('http:') === 0 || low.indexOf('https:') === 0 || low.indexOf('mailto:') === 0) return escapeHtml(trimmed)
    if (low.indexOf('javascript:') === 0 || low.indexOf('data:') === 0 || low.indexOf('vbscript:') === 0) return '#'
    // 协议相对 URL（//evil.com）在 file:// 环境下解析为 UNC 路径，非预期行为
    if (trimmed.indexOf('//') === 0) return '#'
    return escapeHtml(trimmed)
}
/**
 * 处理行内 Markdown 格式：粗体、斜体、删除线、图片、链接
 * 注：入参 s 已在 renderMarkdown 中经过 escapeHtml 转义
 * @param {string} s - 已转义的行内文本
 * @returns {string} 渲染后的 HTML
 */
function inlineFmt(s) {
    if (!s) return ''
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    s = s.replace(/\*(.+?)\*/g, '<em>$1</em>')
    s = s.replace(/~~(.+?)~~/g, '<del>$1</del>')
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(m, alt, url) { return '<img src="' + safeHref(url) + '" alt="' + alt + '" style="max-width:100%">' })
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, text, url) { return '<a href="' + safeHref(url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>' })
    return s
}
function scrollToBottom() { setTimeout(function() { if ($messages) $messages.scrollTop = $messages.scrollHeight }, 50) }

// ============================================================
// 启动流程：检查服务是否已在运行 → 是则直接进 chat；否则显示 setup
// 同时检查 launcher 状态
// ============================================================
(function init() {
    var lastCwd = getPS('opencode_cwd')
    if (lastCwd) $setupCwd.value = lastCwd.replace(/\\\\/g, '\\')

    // 进入 chat 视图：设置项目目录并走 onServerConnected（幂等）——两处探测成功共用此逻辑（评审 P3 去重）
    var enterChat = function(cwd) {
        PROJECT_DIR = cwd || ''
        $topbarCwd.textContent = PROJECT_DIR.replace(/\\\\/g, '\\')
        $topbarCwd.title = PROJECT_DIR.replace(/\\\\/g, '\\')
        onServerConnected()
    }

    // 并行检查 launcher 和 opencode 服务
    var checkLauncher = function(cb) {
        var xhr = new XMLHttpRequest()
        xhr.timeout = 3000
        xhr.open('GET', 'http://127.0.0.1:14097/status', true)
        xhr.onload = function() { cb(xhr.status === 200) }
        xhr.onerror = function() { cb(false) }
        xhr.ontimeout = function() { cb(false) }
        try { xhr.send() } catch(e) { cb(false) }
    }

    var checkOpenCode = function(cb) {
        fetchJSON('GET', '/global/health', null, function(data) {
            cb(data && data.healthy)
        }, function() { cb(false) })
    }

    // 先检查 launcher 和 opencode 状态
    checkLauncher(function(launcherOk) {
        checkOpenCode(function(opencodeOk) {
            if (opencodeOk) {
                // 服务已运行，直接进 chat
                enterChat(lastCwd)
            } else if (launcherOk) {
                // /global/health 探测失败但 launcher 可达：回退看 launcher /status 是否确认服务在跑
                probeLauncherRunning(function(launcherRunning) {
                    if (launcherRunning) {
                        enterChat(lastCwd)
                    } else {
                        updateServerStatus(false)
                        showSetup()
                        startHealthCheck()
                    }
                })
            } else {
                // launcher 未运行或 opencode 未启动，都显示 setup；统一启动健康检测以支持自动恢复（评审 P3 合并重复分支）
                updateServerStatus(false)
                showSetup()
                startHealthCheck()   // setup 下也启动健康检测，支持自动恢复
                // launcher 未运行 + /global/health 探测失败时，无法区分「服务真停」与
                // 「launcher 挂了但 opencode 在跑」。用 SSE 作第三信号源最终探测：
                // EventSource 不受 XHR CORS 差异影响，onopen 成功即证明服务在跑并自动恢复；
                // 服务真停时 onerror 且不自动重连（SESSION_ID 为空），不会误报也不会连接风暴。
                // 该 connectSSE 会在 SSE onopen 中经 showChat/updateServerStatus 恢复状态。
                // 第 1 轮评审：标记为探测性连接（connectSSE(true)），失败时不自动重连（服务真停时只靠健康检查周期再探）。
                connectSSE(true)
            }
        })
    })


    // 在线状态监听：断网时标记，恢复后重连SSE
    window.addEventListener('online', function() {
        console.log('[network] Back online');
        if (CONNECTED === false && SESSION_ID) {
            connectSSE();
        }
    });
    window.addEventListener('offline', function() {
        console.log('[network] Offline');
        CONNECTED = false;
        updateConnectionStatus();
    });

})()
</script>
